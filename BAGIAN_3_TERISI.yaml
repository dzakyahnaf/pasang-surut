# INSTRUKSI TAMBAHAN UNTUK CLAUDE CODE:
# Karena geospasial "belum pernah", setiap kali menulis kode yang menyentuh
# CRS, proyeksi, raster, atau graf jaringan, sertakan komentar Bahasa Indonesia
# yang menjelaskan APA yang terjadi dan KENAPA, bukan sekadar apa yang dilakukan
# baris itu. Contoh yang diharapkan:
#
#   # EPSG:4326 pakai satuan derajat, jadi jarak tidak bisa dihitung langsung.
#   # Diproyeksikan dulu ke EPSG:32749 (UTM 49S, zona Jawa Tengah) supaya
#   # satuannya meter dan panjang ruas jalan akurat.
#
# Tim ini akan ditanya juri soal metodologi (bobot 10% penyisihan, 20% tanya
# jawab di final). Mereka harus paham kodenya sendiri, bukan sekadar menjalankannya.

