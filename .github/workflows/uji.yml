# Jalankan seluruh uji setiap kali ada push atau pull request.
#
# Sekaligus membuktikan hal yang selama ini hanya diuji di laptop tim:
# `pip install -r requirements.txt` lalu `pytest -q` dari akar repo berhasil
# di mesin bersih, tanpa .env, tanpa database, dan tanpa berkas yang tidak
# ikut di-commit.

name: Uji

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Versi minor dikunci 3.11, sama dengan .python-version. Versi patch
      # dibiarkan terbaru supaya tidak bergantung pada ketersediaan satu
      # rilis tertentu di runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Pasang dependency
        run: pip install -r requirements.txt

      - name: Jalankan uji
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
