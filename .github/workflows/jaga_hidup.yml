# Pemeriksaan kesehatan jalur publik Vercel -> VPS PASANG SURUT.
# Jadwal GitHub dapat terlambat; bukan pemantauan uptime dengan SLA.
# Nama workflow dipertahankan agar riwayat run tetap mudah ditemukan.

name: Jaga hidup

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaga-hidup
  cancel-in-progress: false

jobs:
  ketuk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALAMAT: https://pasang-surut.vercel.app/api/kesehatan
    steps:
      - name: Ketuk /api/kesehatan
        run: |
          # Batas retry terbatas; VPS tidak memakai mekanisme tidur Render.
          curl --fail --silent --show-error --max-time 30 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               "$ALAMAT" -o kesehatan.json
          jq '{database, commit, jumlah_ruas, prediksi_selesai_utc,
               potret_berlaku_sampai_utc}' kesehatan.json

      - name: Periksa isinya
        run: |
          sekarang=$(date -u +%s)

          if [ "$(jq -r .database kesehatan.json)" != "true" ]; then
            echo "::error::API tidak memakai database VPS. Periksa container database PASANG SURUT dan status fallback."
            exit 1
          fi

          if [ "$(jq -r .data_tersedia kesehatan.json)" != "true" ]; then
            echo "::error::Data perjalanan tidak tersedia. Periksa publikasi dan masa berlaku data."
            exit 1
          fi

          selesai=$(jq -r '.akhir_eksklusif_utc // empty' kesehatan.json)
          if [ -z "$selesai" ] || [ "$(date -u -d "$selesai" +%s)" -lt $((sekarang + 72 * 3600)) ]; then
            echo "::warning::Prediksi berakhir ${selesai:-entah kapan}, kurang dari 72 jam lagi. Jam sesudahnya akan ditolak karena data tidak tersedia. Jalankan ulang 11_indeks_kerentanan."
          fi
