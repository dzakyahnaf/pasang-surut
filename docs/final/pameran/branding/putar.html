<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASANG SURUT — Video pameran</title>
<style>
  :root { color-scheme: dark; background: #0b1f2a; color: #e8f1f4; font: 16px system-ui,sans-serif; }
  body { margin:0; display:grid; min-height:100svh; align-content:center; }
  video { display:block; width:100%; max-height:88svh; background:#0b1f2a; }
  nav { display:flex; gap:12px; align-items:center; justify-content:center; padding:16px; flex-wrap:wrap; }
  button { cursor:pointer; color:inherit; background:#12303e; border:1px solid #7e97a3; border-radius:3px; font:inherit; padding:12px 20px; }
  button:focus-visible { outline:3px solid #a5dbdf; }
  p { margin:0; color:#a5dbdf; }
</style>
<video id="film" controls loop playsinline preload="metadata" poster="Poster_Branding.jpg">
  <source src="Pasang_Surut_Branding_105s.mp4" type="video/mp4">
  Peramban ini tidak mendukung video MP4. Buka berkas dengan pemutar video.
</video>
<nav>
  <button id="play">Putar dengan suara</button>
  <button id="silent">Putar tanpa suara</button>
  <button id="full">Layar penuh</button>
  <p>1:45 · Berulang otomatis · Subtitle sudah ada di video</p>
</nav>
<script>
  const film=document.querySelector('#film');
  document.querySelector('#play').onclick=()=>{film.muted=false;film.volume=.7;film.play();};
  document.querySelector('#silent').onclick=()=>{film.muted=true;film.play();};
  document.querySelector('#full').onclick=()=>film.requestFullscreen();
</script>
</html>
